name: "CI/CD with Security Scans"

on:
  push:
    branches: [ production, development ]
  pull_request:
    branches: [ production, development ]
  schedule:
    - cron: '29 12 * * 0'   # weekly for Snyk-style scan
    - cron: '35 1 * * 4'    # weekly for CodeQL

permissions:
  security-events: write
  contents: read
  actions: read
  packages: read

jobs:
  UnitTesten:
    name: UnitTesten
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.407'

      - name: Install dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build

  vulnerability-check:
    name: Check NuGet Vulnerabilities
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore packages
        run: dotnet restore

      - name: Check for NuGet vulnerabilities
        run: |
          result=$(dotnet list package --vulnerable)
          echo "$result"
          if echo "$result" | grep -q 'has the following vulnerable packages'; then
            echo "::error::Vulnerable packages found"
            exit 1
          fi

  codeql:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.language == 'swift' && 'macos-latest' || 'ubuntu-latest' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
